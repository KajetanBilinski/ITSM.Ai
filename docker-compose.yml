services:
  postgres:
    image: postgres:17
    container_name: itsmai-postgres
    environment:
      POSTGRES_DB: itsmai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - itsmai_postgres_data:/var/lib/postgresql/data

volumes:
  itsmai_postgres_data: